# Public access through a Cloudflare Tunnel while this machine runs the stack (no router port needed).
# Put these in .env (gitignored):
#   GOMOKU_PUBLIC_HOST=gomoku.example.com      # the tunnel's public hostname
#   CLOUDFLARE_TUNNEL_TOKEN=eyJ...             # from Zero Trust > Networks > Tunnels
# Start:  docker compose -f compose.yaml -f compose.tunnel.yaml up -d --build
# In the tunnel's Public Hostname settings, point the hostname at:  http://api:8080
services:
  # Come back by themselves after a host reboot (the base compose file is tuned for local development).
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    restart: unless-stopped
    environment:
      # Public traffic: no Development error pages, Secure cookies (the tunnel serves HTTPS).
      ASPNETCORE_ENVIRONMENT: Production
      # 127.0.0.1 keeps the container healthcheck allowed.
      AllowedHosts: "${GOMOKU_PUBLIC_HOST:?set GOMOKU_PUBLIC_HOST in .env};127.0.0.1;localhost"
      # Trust X-Forwarded-For only from cloudflared, so rate limits see each player's real IP.
      RateLimiting__KnownProxies__0: 172.30.66.10
    networks:
      - default
      - tunnel

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      tunnel:
        ipv4_address: 172.30.66.10

  # Daily database dump into ./backups next to the compose files, newest 7 kept (ops/db-backup.sh).
  # Turns "unhealthy" in `docker compose ps` when the newest backup is missing or older than 26 hours.
  backup:
    image: postgres:17.11-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: gomoku
      PGDATABASE: gomoku
      PGPASSWORD: ${GOMOKU_POSTGRES_PASSWORD:?set GOMOKU_POSTGRES_PASSWORD in .env}
      BACKUP_KEEP: 7
      BACKUP_EVERY_HOURS: 24
    volumes:
      - ./backups:/backups
      # The whole directory, not the file: an editor that replaces the file would leave the container on the old copy.
      - ./ops:/ops:ro
    entrypoint: ["sh", "-c", "while true; do sh /ops/db-backup.sh --if-due || true; sleep 3600; done"]
    healthcheck:
      test: ["CMD", "sh", "/ops/db-backup.sh", "--health"]
      interval: 5m
      timeout: 10s
      start_period: 2m

networks:
  tunnel:
    ipam:
      config:
        - subnet: 172.30.66.0/24
