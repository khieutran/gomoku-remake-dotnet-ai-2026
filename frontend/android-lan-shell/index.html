<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gomoku</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #f6ecd8; color: #1d1d1b; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 360px; border: 3px solid #1d1d1b; background: #fffaf0; box-shadow: 6px 6px 0 #1d1d1b; padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    code { word-break: break-all; }
    a { display: block; margin-top: 20px; padding: 12px; border: 2px solid #1d1d1b; background: #ffd23f;
      color: inherit; font-weight: 700; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Không kết nối được máy chủ</h1>
    <p>App đang tìm máy chủ tại <code>__GOMOKU_LAN_URL__</code>.</p>
    <p>Kiểm tra: máy chủ (Mac) đang bật và Docker đang chạy, điện thoại có mạng. Nếu dùng địa chỉ trong nhà, điện thoại phải cùng Wi-Fi với Mac.</p>
    <a href="__GOMOKU_LAN_URL__">Thử lại</a>
  </main>
</body>
</html>
