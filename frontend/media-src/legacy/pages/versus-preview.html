<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomoku · Versus transition preview</title>
  <style>
    :root { color-scheme: light; --ink: #49313b; --cream: #fff2dd; --yellow: #ffd36f; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; gap: 20px; padding: 24px; background: #171923; color: var(--cream); font: 700 16px/1.5 system-ui, sans-serif; background-image: radial-gradient(circle at 30% 30%, #6f2a4d77, transparent 33%), radial-gradient(circle at 75% 72%, #147b8077, transparent 36%), repeating-linear-gradient(0deg, transparent 0 38px, #ffffff0d 39px 40px), repeating-linear-gradient(90deg, transparent 0 38px, #ffffff0d 39px 40px); }
    main { width: min(100%, 1100px); }
    h1 { margin: 0 0 14px; font-size: clamp(1.1rem, 2vw, 1.5rem); }
    .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 5px solid var(--ink); background: radial-gradient(circle at 50% 50%, #713151 0, transparent 35%), repeating-linear-gradient(0deg, transparent 0 37px, #6e47674d 38px 39px), repeating-linear-gradient(90deg, transparent 0 37px, #6e47674d 38px 39px), linear-gradient(115deg, #251325, #092c34); box-shadow: 8px 8px 0 #7a5362; isolation: isolate; }
    .stage::after { content: ''; position: absolute; z-index: 6; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 4px #ffd36f59; }
    .game-screen { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(110px, 28%); align-items: center; gap: 3%; padding: 3%; background: #dce8fa; color: var(--ink); }
    .game-board { position: relative; height: 100%; width: auto; max-width: 100%; aspect-ratio: 1; justify-self: center; border: 4px solid #70515a; background-color: #f4d7ae; background-image: linear-gradient(#ba8e7d 1px, transparent 1px), linear-gradient(90deg, #ba8e7d 1px, transparent 1px); background-size: 5% 5%; box-shadow: 5px 5px 0 #70515a; }
    .stone { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); font: 900 clamp(1.1rem, 2.8vw, 2rem)/1 system-ui, sans-serif; }
    .stone--x { color: #a42a54; }
    .stone--o { color: #246d73; }
    .game-status { align-self: start; padding: 14px; border: 3px solid #70515a; background: #ffe6d0; box-shadow: 4px 4px 0 #70515a; }
    .game-status strong { display: block; margin-bottom: 9px; font-size: clamp(.85rem, 1.7vw, 1.25rem); }
    .game-status span { font-size: clamp(.7rem, 1.3vw, 1rem); }
    .panel { position: absolute; z-index: 2; inset: 3%; background-image: url('images/versus-arcade-panels.png'); background-repeat: no-repeat; background-size: 100% 100%; will-change: transform, filter; }
    .panel--human { clip-path: polygon(0 0, 50% 0, 51% 12%, 49% 25%, 52% 39%, 49% 51%, 51% 64%, 48% 77%, 51% 89%, 50% 100%, 0 100%); }
    .panel--bot { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%, 51% 89%, 48% 77%, 51% 64%, 49% 51%, 52% 39%, 49% 25%, 51% 12%); }
    .seam { position: absolute; z-index: 3; inset: 3%; width: 94%; height: 94%; overflow: visible; opacity: 0; filter: drop-shadow(0 0 4px #ffcf68); }
    .seam polyline { fill: none; stroke: var(--yellow); stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
    .impact { position: absolute; z-index: 7; inset: 0; pointer-events: none; opacity: 0; background: var(--cream); }
    .vs { position: absolute; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.1) rotate(-12deg); opacity: 0; color: var(--yellow); -webkit-text-stroke: clamp(3px, .6vw, 8px) #552b3d; paint-order: stroke fill; font: 1000 clamp(4rem, 14vw, 12rem)/1 system-ui, sans-serif; letter-spacing: -.13em; text-shadow: 7px 8px 0 #251a26; }
    .stage.playing { animation: collide 1.65s both; }
    .playing .game-screen { animation: board-reveal 1.65s both; }
    .playing[data-exit="split"] .panel--human { animation: human-split 1.65s both; }
    .playing[data-exit="split"] .panel--bot { animation: bot-split 1.65s both; }
    .playing[data-exit="drop"] .panel--human { animation: human-drop 1.65s both; }
    .playing[data-exit="drop"] .panel--bot { animation: bot-drop 1.65s both; }
    .playing .seam { animation: seam-in 1.65s both; }
    .playing .impact { animation: impact 1.65s both; }
    .playing .vs { animation: vs-in 1.65s both; }
    @keyframes human-split { 0% { transform: translateX(-110%); filter: brightness(.4); } 25% { transform: translateX(-12%); filter: brightness(.7); } 33%, 60% { transform: translateX(0); filter: brightness(1); } 69% { transform: translateX(4%); } 100% { transform: translateX(-110%); } }
    @keyframes bot-split { 0% { transform: translateX(110%); filter: brightness(.4); } 25% { transform: translateX(12%); filter: brightness(.7); } 33%, 60% { transform: translateX(0); filter: brightness(1); } 69% { transform: translateX(-4%); } 100% { transform: translateX(110%); } }
    @keyframes human-drop { 0% { transform: translateX(-110%); filter: brightness(.4); } 25% { transform: translateX(-12%); filter: brightness(.7); } 33%, 60% { transform: translate(0, 0); filter: brightness(1); } 69% { transform: translate(-2%, -4%); } 100% { transform: translate(-7%, 115%) rotate(-5deg); } }
    @keyframes bot-drop { 0% { transform: translateX(110%); filter: brightness(.4); } 25% { transform: translateX(12%); filter: brightness(.7); } 33%, 60% { transform: translate(0, 0); filter: brightness(1); } 69% { transform: translate(2%, -4%); } 100% { transform: translate(7%, 115%) rotate(5deg); } }
    @keyframes seam-in { 0%, 31% { opacity: 0; } 35%, 60% { opacity: .8; } 75%, 100% { opacity: 0; } }
    @keyframes impact { 0%, 31% { opacity: 0; } 33% { opacity: .95; } 38%, 100% { opacity: 0; } }
    @keyframes vs-in { 0%, 33% { opacity: 0; transform: translate(-50%, -50%) scale(.1) rotate(-12deg); } 42% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(4deg); } 52%, 60% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-4deg); } 76%, 100% { opacity: 0; transform: translate(-50%, 35%) scale(.7) rotate(-4deg); } }
    @keyframes board-reveal { 0%, 58% { filter: brightness(.38) saturate(.6); } 86%, 100% { filter: brightness(1) saturate(1); } }
    @keyframes collide { 0%, 31% { transform: translate(0); } 33% { transform: translate(-13px, 6px); } 35% { transform: translate(11px, -5px); } 38% { transform: translate(-6px, 3px); } 42%, 100% { transform: translate(0); } }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 22px; }
    button { min-height: 44px; padding: 8px 18px; border: 3px solid var(--ink); background: var(--yellow); box-shadow: 4px 4px 0 var(--ink); color: var(--ink); font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #9d2451; outline-offset: 4px; }
    p { margin: 0; font-weight: 500; }
    @media (max-width: 600px) { body { padding: 12px; } .vs { font-size: 17vw; } .game-screen { grid-template-columns: minmax(0, 1fr) 25%; padding: 2%; } .game-status { padding: 5px; border-width: 2px; } .game-status strong { margin: 0; } .game-status span { display: none; } }
    @media (prefers-reduced-motion: reduce) { .stage.playing, .playing .game-screen, .playing .panel, .playing .seam, .playing .impact, .playing .vs { animation: none; } .panel, .seam, .impact, .vs { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Bản xem trước hiệu ứng vào trận</h1>
    <div class="stage playing" data-exit="split" aria-label="Não người và chip AI va vào nhau rồi rời đi, để lộ bàn cờ">
      <div class="game-screen" aria-hidden="true"><div class="game-board"><span class="stone stone--x" style="--x:47.5%;--y:47.5%">X</span><span class="stone stone--o" style="--x:52.5%;--y:47.5%">O</span><span class="stone stone--x" style="--x:47.5%;--y:52.5%">X</span></div><div class="game-status"><strong>Ván đấu</strong><span>Đến lượt bạn · X</span></div></div>
      <div class="panel panel--human" aria-hidden="true"></div>
      <div class="panel panel--bot" aria-hidden="true"></div>
      <svg class="seam" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><polyline points="500,0 510,120 490,250 520,390 490,510 510,640 480,770 510,890 500,1000"></polyline></svg>
      <div class="impact" aria-hidden="true"></div>
      <div class="vs" aria-hidden="true">VS</div>
    </div>
    <div class="controls"><button type="button" data-replay="split">Tách ra hai bên</button><button type="button" data-replay="drop">Rơi xuống</button><p>Hai cách kết thúc để anh chọn</p></div>
  </main>
  <script>
    const stage = document.querySelector('.stage');
    document.querySelectorAll('[data-replay]').forEach(button => button.addEventListener('click', () => {
      stage.classList.remove('playing');
      stage.dataset.exit = button.dataset.replay;
      void stage.offsetWidth;
      stage.classList.add('playing');
    }));
  </script>
</body>
</html>
