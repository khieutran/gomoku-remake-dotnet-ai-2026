services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: gomoku
      POSTGRES_USER: gomoku
      POSTGRES_PASSWORD: ${GOMOKU_POSTGRES_PASSWORD:-gomoku_dev}
    ports:
      - "127.0.0.1:${GOMOKU_POSTGRES_PORT:-55432}:5432"
    volumes:
      - gomoku_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomoku -d gomoku"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${GOMOKU_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: backend/Gomoku.Api/Dockerfile
    image: gomoku-api:local
    entrypoint: ["/app/efbundle"]
    environment:
      GOMOKU_POSTGRES_CONNECTION: "Host=postgres;Port=5432;Database=gomoku;Username=gomoku;Password=${GOMOKU_POSTGRES_PASSWORD:-gomoku_dev}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: gomoku-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${GOMOKU_ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Gomoku: "Host=postgres;Port=5432;Database=gomoku;Username=gomoku;Password=${GOMOKU_POSTGRES_PASSWORD:-gomoku_dev}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=500,asyncTimeout=500"
      GOMOKU_REDIS_NAMESPACE: ${GOMOKU_REDIS_NAMESPACE:-gomoku:local}
      GOMOKU_DP_KEYS_DIR: /app/keys
    ports:
      - "127.0.0.1:${GOMOKU_API_PORT:-58080}:8080"
    volumes:
      - gomoku_keys:/app/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

volumes:
  gomoku_postgres:
  gomoku_keys:
